services:
  django:
    build: ./Cohort360-Back-end
#    image: ${BACK_IMAGE}
    container_name: django
    ports:
      - ${BACK_LOCAL_PORT}:8080
    env_file:
      - env/django.env
    command: ["-b", "-i", "-d", "-l"]
    volumes:
      - ./conf/perimeters.csv:/perimeters.csv
      - ./conf/email_templates:/home/cohort360-backend/app/templates
    depends_on:
      - pg-db
      - redis
    healthcheck:
      test: [ "CMD-SHELL", "curl http://localhost:8000/auth/login/ | grep '<!DOCTYPE html>' > /dev/null; if [ 0 != $$? ]; then exit 1; fi;" ]
      interval: ${HEALTHCHECK_PERIOD}
      timeout: 5s
      retries: 5
    networks:
      default:

  query_executor:
    build: ./Cohort360-QueryExecutor
#     image: ${QUERY_EXECUTOR_IMAGE}
    container_name: query_executor
    depends_on:
      - django
      - fhir
    ports:
      - ${QUERY_EXECUTOR_LOCAL_PORT}:8090
# pour débugger en remote par exemple
#      - 5005:5005
    env_file:
      - env/query_executor.env
    networks:
      default:

  fhir:
    image: ${FHIR_IMAGE}
    container_name: fhir
    ports:
      - ${FHIR_LOCAL_PORT}:8080
    depends_on:
      pg-db:
        condition: service_healthy
    volumes:
      - ./conf/hapi.application.yaml:/app/config/application.yaml
    networks:
      default:

  portail:
    build: ./Cohort360-AdministrationPortal
#    image: ${PORTAIL_IMAGE}
    container_name: portail
    ports:
      - ${PORTAIL_LOCAL_PORT}:5003
    depends_on:
      - django
    env_file:
      - env/portail.env
    networks:
      default:

  front:
    build: ./Cohort360-FrontEnd
#    image: ${FRONT_IMAGE}
    ports:
      - ${FRONT_LOCAL_PORT}:5003
    volumes:
      - ./conf/front.config.json:/app/build/config.json
    depends_on:
      - fhir
      - django
    container_name: front
    env_file:
      - env/front.env
    networks:
      default:


  # 3rd party services

  redis:
    image: ${REDIS_IMAGE}
    container_name: redis
    ports:
      - ${REDIS_LOCAL_PORT}:6382
    volumes:
#    this modified configuration disable the disk persistence (to fix potential cache issues)
      - ./conf/redis.conf:/root/redis.conf
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    networks:
      default:


  pg-db:
    image: postgres:14.3
    container_name: pg-db
    ports:
      - ${PG_LOCAL_PORT}:5432
    env_file:
      - env/pg.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: ${HEALTHCHECK_PERIOD}
      timeout: 5s
      retries: 5
    volumes:
      - c360-pg-db:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      default:



volumes:
    c360-pg-db:
    init-status:
